# Abate CI 门禁：任何规则命中即 FAIL，禁止桩/占位/半成品代码合入。
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.11"
  GOLANGCI_LINT_VERSION: "v2.1.6"

jobs:
  gate:
    name: strict-lint-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Install auxiliary gate tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install github.com/google/go-licenses@latest

      - name: Run strict gate (header+style+license+gofmt+vet+golangci-lint+test-race+coverage+build)
        run: bash scripts/lint-gate.sh
