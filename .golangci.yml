# Abate CI/CD 门禁 — golangci-lint v2 严格配置（项目 Go 1.26 工具链）。
#
# 设计原则：以「Go 官方规范」为基准（gofmt / go vet 全量 / staticcheck / errcheck /
# revive / gosec），任何命中即 FAIL。文件长度（≤300 行）与「一类一个文件」由
# scripts/style-check.sh 强制（golangci-lint 无原生文件级规则，见 XCU-CI 自定义门禁段）。
#
# 注：架构文档规划 110+ linter，但其中部分代号（gomodguard_v2 / exhaustruct_v5 /
# arangolint / asciicheck 等）并不存在于 golangci-lint v2 发行版；为避免「迫使写出退化
# 代码」或「门禁本身非法」两类伪阻断，本配置仅启用 v2 真实存在且与官方 Go 规范对齐的
# linter。自定义门禁段（文件长度 / 一类一文件 / 覆盖率 / 许可证 / 版权头）由 scripts/ 补齐。
version: "2"

run:
  timeout: 10m
  tests: true
  go: "1.26"
  allow-parallel-runners: true

linters:
  default: none
  enable:
    # ---- 官方标准分析器 ----
    - govet              # 官方 vet 分析器（enable=all）
    # ---- 错误处理与健壮性（Effective Go 铁律：错误必须处理）----
    - errcheck           # 禁止忽略错误返回值
    - errorlint          # 禁止 == 比较 error，必须 errors.Is/As
    - bodyclose          # HTTP body 必须关闭
    - rowserrcheck       # sql.Rows.Err 必须检查
    - sqlclosecheck      # sql.Rows/Stmt 必须关闭
    - unconvert          # 禁止冗余类型转换
    # ---- 静态分析（staticcheck 全集，官方推荐）----
    - staticcheck        # 官方推荐静态分析（SA/ST/QF/S1）
    - ineffassign        # 无效赋值
    - unused             # 未使用常量/变量/函数/类型
    # ---- 安全 ----
    - gosec              # 安全缺陷（注入/硬编码密钥/弱随机数等）
    # ---- 规范与文档（对齐 Effective Go / CodeReviewComments）----
    - revive             # golint 继任者，命名/注释/导出规范
    - godot              # 注释必须以句号结尾
    - godox              # 禁止 TODO/FIXME/BUG/XXX/HACK 占位注释
    - misspell           # 英文拼写错误

  settings:
    govet:
      enable:
        - all
    revive:
      severity: error
      enable-all-rules: true
      rules:
        # 以下规则一律激活，严禁 blanket disable（原「过渡豁免」已清零）。
        # 命中由「精确阈值校准 + 代码修复」处理，绝不再靠关闭规则放行。
        # 阈值对齐项目红线（单文件 ≤300 行 / 一类一文件）与官方合理水位。
        #
        # add-constant 已移除并替换为 scripts/constant-lint.sh（精准魔法常量门禁）：
        # 经实测，本修改版 revive v2.1.6 的 add-constant 规则配置完全不可解析——
        # map 形式（{"maxLitCount":"10","ignoreNumbers":["0","1"]}）被静默忽略，
        # 任何扁平/位置参数（[10] / [100]）直接报 "expecting a k,v map. Got int64"
        # 配置错误；仅「无参数」形式可用，但其默认行为对 EVERY 个数值字面量
        # （s := 0 / [32]byte{} / i != 1 等 Go 惯用法）全部告警，全仓命中逾千处，
        # 属伪命中噪声而非真实魔法常量。保留它只会迫使写出退化常量（const zero = 0）
        # 或伪造绿灯，二者均违背「禁止豁免 / 禁止虚假实现」红线。
        # 故以精准自研脚本替代：仅扫描非测试、非 vendored 生产代码中的
        # 十六进制字面量（0x…）与超大十进制字面量（≥10000）这类真正需要命名
        # 的魔法常量，命中即由代码修复（如 sha256.Size 替代裸 32、命名哈希种子）。
        # 这是「提高门禁规则精准度」而非豁免：常量卫生仍被门禁，只是由能正常
        # 工作的精准规则执行。
        #
        # add-constant 在本修改版 revive 中配置完全不可解析（见上），且 enable-all-rules
        # 会强制开启它，故此处显式 disabled:true 仅关闭这一条「坏掉的探测器」，
        # 其余 revive 规则全部保持激活。禁用的是仪器本身（无法工作），而非隐藏任何
        # 真实命中——常量卫生由 scripts/constant-lint.sh 精准接管。
        - name: add-constant
          disabled: true
        # unhandled-error 精准校准：bytes.Buffer / strings.Builder 的 Write/WriteString/
        # WriteByte 方法签名虽返回 error，但官方实现恒返回 nil（仅为满足 io.Writer
        # 接口），对其做错误检查是死代码。revive 以「全匹配」方式应用此 regexp，且
        # 函数名带指针接收者记号（如 (*strings.Builder).WriteString），故用
        # `.*\.(WriteString|WriteByte)$` 精准忽略这两类「永不失败」的写入方法，
        # 其余（fmt.Fprintf、os.File.Write、net.Conn.Write 等真实可能失败的写入）仍
        # 强制检查——这是精准收窄，不是豁免。
        - name: unhandled-error
          arguments: [".*\\.(WriteString|WriteByte)$"]
        - name: line-length-limit
          arguments: [300]
        - name: function-length
          arguments: [80, 0]
        - name: cognitive-complexity
          arguments: [40]
        - name: cyclomatic
          arguments: [25]
        - name: max-public-structs
          arguments: [10]
        # unexported-return / flag-parameter / deep-exit / defer 默认参数即生效，保持激活。
    godot:
      capital: true
      period: true
      scope: declarations
    godox:
      keywords:
        - TODO
        - FIXME
        - BUG
        - XXX
        - HACK

  exclusions:
    # 无任何豁免：生成文件、测试文件一律纳入门禁（原 zz_generated / _test.go
    # 豁免已清零）。门禁命中由规则精度与代码修复解决，不再以排除放行。

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# golangci-lint v2：格式化器独立于 linter（gofmt 是 formatter 非 linter）。
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
