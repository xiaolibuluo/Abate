apiVersion: ces.tencent.com/v1
kind: Experiment
metadata:
  name: cli-e2e-violated
  namespace: default
spec:
  target:
    kind: simulator
    selector:
      node: n1
  steadyState:
    - probeRef: health
      expectation:
        type: value
        value: "42"
      tolerance:
        type: absolute
        value: 1
      holdFor: 1s
  method:
    expression: "ε"
  probes:
    - id: health
      kind: http
      spec:
        url: http://sim/health
        method: GET
        expectStatus: 200
      interval: 1s
  rollback:
    strategy: auto
    verifySteadyState: true
  schedule:
    once:
      at: 5s
  seed: 12345
