#
# 本文件演示 F2.1 进程终止实验。
# This file demonstrates an F2.1 process-kill experiment.

id: exp-crash-demo
seed: 128
criticality: 4
recoveryBudgetMs: 120000

target:
  kind: instance
  name: i-order-service-0

fault:
  type: F2
  signal: SIGTERM

blastRadius:
  maxInstances: 1
  maxDurationMs: 30000
  maxTraffic: 500

steadyState:
  - sli: availability
    assert: ">= 99.9%"
    windowMs: 30000
    method: rate

abortOn:
  - sli: availability
    assert: "< 99%"
    windowMs: 5000
    method: rate
